services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: rutasegura
      POSTGRES_PASSWORD: rutasegura
      POSTGRES_DB: rutasegura
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/amba.osrm
    volumes:
      - ./osrm/data:/data
    ports:
      - "5001:5000"

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rutasegura:rutasegura@postgres:5432/rutasegura
      OSRM_URL: http://osrm:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - osrm
    ports:
      - "8000:8000"

  # Microservicio aislado del scraper de X (seccion 5.1 del spec). Opt-in
  # porque depende de scraping fragil y de completar scraper/accounts.py:
  # levantar con `docker compose --profile scraper up`.
  scraper:
    build: ../scraper
    restart: unless-stopped
    profiles: ["scraper"]
    environment:
      BACKEND_URL: http://backend:8000
      POLL_INTERVAL_SECONDS: "1800"
    volumes:
      - scraper_state:/app/data
    depends_on:
      - backend

volumes:
  postgres_data:
  scraper_state:
