services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: rutasegura
      POSTGRES_PASSWORD: rutasegura
      POSTGRES_DB: rutasegura
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Sin "ports": solo se accede via la red interna de Docker (backend
    # habla con "postgres:5432"). No hace falta exponerlo al host, y menos
    # todavia en un servidor con IP publica como la VM de Oracle Cloud.

  osrm:
    image: ${OSRM_IMAGE:-osrm/osrm-backend}
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/amba.osrm
    volumes:
      - ./osrm/data:/data
    # Idem postgres: solo lo consume "backend" via la red interna
    # ("osrm:5000"), no necesita puerto publicado al host.

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rutasegura:rutasegura@postgres:5432/rutasegura
      OSRM_URL: http://osrm:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - osrm
    ports:
      - "8000:8000"

  # Microservicio aislado del scraper de X (seccion 5.1 del spec). Opt-in
  # porque depende de scraping fragil y de completar scraper/accounts.py:
  # levantar con `docker compose --profile scraper up`.
  scraper:
    build: ../scraper
    restart: unless-stopped
    profiles: ["scraper"]
    environment:
      BACKEND_URL: http://backend:8000
      POLL_INTERVAL_SECONDS: "1800"
    volumes:
      - scraper_state:/app/data
    depends_on:
      - backend

  # Expone "backend" a internet sin abrir puertos en el router ni tener IP
  # publica (self-hosting en una compu de casa, seccion "Deploy" del README).
  # "Quick tunnel": no requiere cuenta ni tarjeta, genera una URL
  # https://xxxx.trycloudflare.com al azar en cada arranque (ver logs con
  # `docker compose logs -f cloudflared`). Opt-in: `docker compose --profile tunnel up`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --url http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  scraper_state:
