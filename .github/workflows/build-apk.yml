name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL del backend (dejar el default si todavia no hay uno desplegado)"
        required: false
        default: "http://10.0.2.2:8000"
  push:
    branches:
      - claude/app-development-xb04e9
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"
          cache: true

      - name: Generar proyecto Android (android/, no tocado en el repo)
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Agregar permisos de ubicacion al manifest
        working-directory: mobile
        run: |
          awk '/<manifest /{
            print;
            print "    <uses-permission android:name=\"android.permission.INTERNET\" />";
            print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />";
            print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />";
            next
          }1' android/app/src/main/AndroidManifest.xml > /tmp/AndroidManifest.xml
          mv /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (release, firmado con el keystore de debug para pruebas)
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://10.0.2.2:8000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: rutasegura-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
